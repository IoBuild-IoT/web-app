# Override para una VM con IP pública (sin Dokploy): mismo stack que docker-compose.yml,
# pero el broker MQTT exige usuario/clave porque el puerto 1884 queda abierto a internet.
# Uso:  docker compose -f docker-compose.yml -f docker-compose.vm.yml --profile telemetry up -d --build
# Requiere MQTT_PASSWORD (y opcional MQTT_USERNAME, por defecto iobuild) en .env.
services:
  mosquitto:
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME:-iobuild}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env}
    command: >
      sh -c 'mosquitto_passwd -b -c /mosquitto/config/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
      && chown mosquitto:mosquitto /mosquitto/config/passwd
      && exec mosquitto -c /mosquitto/config/mosquitto.conf'
    volumes:
      - ./mosquitto/config/mosquitto.auth.conf:/mosquitto/config/mosquitto.conf:ro

  iobuild-api:
    environment:
      - Mqtt__Username=${MQTT_USERNAME:-iobuild}
      - Mqtt__Password=${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env}

  simulator:
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME:-iobuild}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env}

  iot-monitor:
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME:-iobuild}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env}
